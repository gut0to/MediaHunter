name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install test Chromium
        if: matrix.runner == 'ubuntu-24.04'
        run: pnpm exec playwright install --with-deps chromium
      - name: Exercise the MV3 extension
        if: matrix.runner == 'ubuntu-24.04'
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: always() && matrix.runner == 'ubuntu-24.04'
        with:
          name: mediahunter-browser-results
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: matrix.runner == 'ubuntu-24.04'
        with:
          name: mediahunter-extension
          path: apps/extension/dist/
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows-agent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install optional integration tools
        run: |
          python -m pip install --disable-pip-version-check yt-dlp imageio-ffmpeg
          $tools = Join-Path $env:RUNNER_TEMP 'mediahunter-test-tools'
          New-Item -ItemType Directory -Force $tools | Out-Null
          $ffmpeg = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          Copy-Item -LiteralPath $ffmpeg -Destination (Join-Path $tools 'ffmpeg.exe')
          "MEDIAHUNTER_TEST_FFMPEG=$(Join-Path $tools 'ffmpeg.exe')" >> $env:GITHUB_ENV
          "MEDIAHUNTER_TEST_YTDLP=$((Get-Command yt-dlp).Source)" >> $env:GITHUB_ENV
      - run: go vet ./...
      - run: go test ./...
      - run: go build -trimpath -o mediahunter-agent.exe ./cmd/mediahunter-agent
      - uses: actions/upload-artifact@v4
        with:
          name: mediahunter-agent-windows-amd64
          path: apps/windows-agent/mediahunter-agent.exe
          if-no-files-found: error

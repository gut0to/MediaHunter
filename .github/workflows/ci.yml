name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        if: matrix.runner == 'ubuntu-latest'
        with:
          name: mediahunter-extension
          path: apps/extension/dist/
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows-agent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - run: go vet ./...
      - run: go test ./...
      - run: go build -trimpath -o mediahunter-agent.exe ./cmd/mediahunter-agent
      - uses: actions/upload-artifact@v4
        with:
          name: mediahunter-agent-windows-amd64
          path: apps/windows-agent/mediahunter-agent.exe
          if-no-files-found: error

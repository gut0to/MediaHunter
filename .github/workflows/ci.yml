name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: node scripts/check-docs.mjs
      - run: bash -n scripts/install-hub.sh scripts/uninstall-hub.sh
      - run: pnpm audit --audit-level high
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install test Chromium
        if: matrix.runner == 'ubuntu-24.04'
        run: pnpm exec playwright install --with-deps chromium
      - name: Exercise the MV3 extension
        if: matrix.runner == 'ubuntu-24.04'
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: always() && matrix.runner == 'ubuntu-24.04'
        with:
          name: mediahunter-browser-results
          path: test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: matrix.runner == 'ubuntu-24.04'
        with:
          name: mediahunter-extension
          path: apps/extension/dist/
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows-agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/windows-agent/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install optional integration tools
        run: |
          python -m pip install --disable-pip-version-check yt-dlp imageio-ffmpeg
          $tools = Join-Path $env:RUNNER_TEMP 'mediahunter-test-tools'
          New-Item -ItemType Directory -Force $tools | Out-Null
          $ffmpeg = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          Copy-Item -LiteralPath $ffmpeg -Destination (Join-Path $tools 'ffmpeg.exe')
          "MEDIAHUNTER_TEST_FFMPEG=$(Join-Path $tools 'ffmpeg.exe')" >> $env:GITHUB_ENV
          "MEDIAHUNTER_TEST_YTDLP=$((Get-Command yt-dlp).Source)" >> $env:GITHUB_ENV
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install Hub integration dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Start the real Hub for Windows integration
        working-directory: .
        run: |
          $env:MEDIAHUNTER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'mediahunter-integration-hub'
          $env:MEDIAHUNTER_PORT = '38787'
          $process = Start-Process (Get-Command node).Source -ArgumentList @('apps/hub/src/cli.ts','serve') -WorkingDirectory $env:GITHUB_WORKSPACE -WindowStyle Hidden -PassThru
          "MEDIAHUNTER_TEST_HUB_PID=$($process.Id)" >> $env:GITHUB_ENV
          "MEDIAHUNTER_TEST_HUB=http://127.0.0.1:38787" >> $env:GITHUB_ENV
          for ($attempt=0; $attempt -lt 10; $attempt++) {
            try { Invoke-RestMethod 'http://127.0.0.1:38787/api/v1/health' | Out-Null; break } catch { Start-Sleep -Seconds 1 }
          }
          $extensionCode = node apps/hub/src/cli.ts pair extension
          $agentCode = node apps/hub/src/cli.ts pair windows_agent
          Write-Output "::add-mask::$extensionCode"
          Write-Output "::add-mask::$agentCode"
          "MEDIAHUNTER_TEST_EXTENSION_CODE=$extensionCode" >> $env:GITHUB_ENV
          "MEDIAHUNTER_TEST_AGENT_CODE=$agentCode" >> $env:GITHUB_ENV
      - run: go vet ./...
      - run: go test ./...
      - name: Stop integration Hub
        if: always()
        run: |
          if ($env:MEDIAHUNTER_TEST_HUB_PID) { Stop-Process -Id $env:MEDIAHUNTER_TEST_HUB_PID -ErrorAction SilentlyContinue }
      - run: go build -trimpath -buildvcs=false -ldflags '-s -w' -o mediahunter-agent.exe ./cmd/mediahunter-agent
      - name: Include agent distribution licenses
        run: |
          Copy-Item ../../LICENSE LICENSE
          Copy-Item ../../THIRD_PARTY_NOTICES.md THIRD_PARTY_NOTICES.md
      - uses: actions/upload-artifact@v4
        with:
          name: mediahunter-agent-windows-amd64
          path: |
            apps/windows-agent/mediahunter-agent.exe
            apps/windows-agent/LICENSE
            apps/windows-agent/THIRD_PARTY_NOTICES.md
          if-no-files-found: error

  package:
    needs: [node, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: mediahunter-extension
          path: release-artifacts/extension
      - uses: actions/download-artifact@v4
        with:
          name: mediahunter-agent-windows-amd64
          path: release-artifacts/agent
      - name: Package source and executables
        run: |
          epoch=$(git log -1 --format=%ct)
          find release-artifacts/extension -type f -exec touch -d "@$epoch" {} +
          (cd release-artifacts/extension && zip -X -r ../mediahunter-extension.zip .)
          mv release-artifacts/agent/mediahunter-agent.exe release-artifacts/mediahunter-agent-windows-amd64.exe
          rm -rf release-artifacts/extension release-artifacts/agent
          tar --sort=name --mtime="@$epoch" --owner=0 --group=0 --numeric-owner -czf release-artifacts/mediahunter-hub-linux-source.tar.gz apps/hub/src apps/hub/package.json apps/extension/package.json packages/contracts package.json pnpm-lock.yaml pnpm-workspace.yaml scripts/install-hub.sh scripts/uninstall-hub.sh scripts/mediahunter-hub.service .env.example LICENSE THIRD_PARTY_NOTICES.md README.md docs
          cp LICENSE THIRD_PARTY_NOTICES.md release-artifacts/
          node scripts/package-artifacts.mjs release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: mediahunter-release-candidate
          path: release-artifacts/
          if-no-files-found: error
